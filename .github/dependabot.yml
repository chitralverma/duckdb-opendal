version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/opendal"
    schedule:
      interval: "weekly"

  # The r2 test tier's Miniflare (local R2) and its base image.
  - package-ecosystem: "npm"
    directory: "/test/services/r2"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/test/services/r2"
    schedule:
      interval: "weekly"
