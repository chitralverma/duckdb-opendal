[package]
name = "duckdb-opendal"
version = "0.2.0"

description = "OpenDAL FFI core for the duckdb-opendal filesystem extension"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[lib]
crate-type = ["staticlib"]

[profile.release]
# Never abort the DuckDB host on a Rust panic; panics are caught at the FFI boundary.
codegen-units = 1
lto = true
panic = "unwind"
strip = true

[features]
# Compiled-in OpenDAL services; each maps to opendal/services-<name>. Build a
# subset with `--no-default-features --features services-<name>`.
default = [
  "services-memory",
  "services-fs",
  "services-s3",
  "services-gcs",
  "services-azblob",
  "services-azdls",
  "services-azfile",
  "services-http",
  "services-minio",
  "services-r2",
  "services-hdfs-native",
]
services-azblob = ["opendal/services-azblob"]
services-azdls = ["opendal/services-azdls"]
services-azfile = ["opendal/services-azfile"]
services-fs = ["opendal/services-fs"]
services-gcs = ["opendal/services-gcs"]
services-hdfs-native = [
  "opendal/services-hdfs-native",
  "dep:opendal-service-hdfs-native",
]
services-http = ["opendal/services-http"]
services-memory = ["opendal/services-memory"]
services-minio = ["opendal/services-minio"]
services-r2 = ["opendal/services-r2"]
services-s3 = ["opendal/services-s3"]

[dependencies.opendal]
default-features = false
features = [
  "auto-simulate",
  "executors-tokio",
  "http-transport-reqwest-rustls-no-provider",
  "layers-retry",
  "layers-timeout",
  "layers-concurrent-limit",
  "layers-cache",
]
git = "https://github.com/apache/opendal.git"
rev = "63297c1fe10659476ad50835e88f100042deb09f"

[dependencies]
bytes = "1"
foyer = "0.22.3" # match opendal-service-foyer's version
futures = "0.3"
human-units = { version = "=0.6.0", default-features = false, features = [
  "std",
  "iec-units",
] }
opendal-http-transport-reqwest = { git = "https://github.com/apache/opendal.git", rev = "63297c1fe10659476ad50835e88f100042deb09f", default-features = false, features = [
  "rustls-no-provider",
] }
# The cache backend, used directly so it does not register a `foyer` scheme.
opendal-service-foyer = { git = "https://github.com/apache/opendal.git", rev = "63297c1fe10659476ad50835e88f100042deb09f" }
# Used directly only to turn on its KMS client (HDFS encryption zones) with the
# `ring` provider below, not aws-lc-rs.
opendal-service-hdfs-native = { git = "https://github.com/apache/opendal.git", rev = "63297c1fe10659476ad50835e88f100042deb09f", optional = true, features = [
  "kms-rustls-no-provider",
] }
percent-encoding = "2"
# ring provider, not the default aws-lc-rs: aws-lc-sys fails its ARMv8 asm build
# under MSVC on windows_arm64.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
cbindgen = "0.29"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
