[project]
name = "duckdb-opendal-tooling"
version = "0.1.0"

authors = [{ name = "chitralverma", email = "chitralverma@gmail.com" }]
dependencies = []
description = "Formatting/tooling venv for the duckdb-opendal extension."
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  # Pins mandated by duckdb/scripts/format.py (make format):
  "clang-format==11.0.1", # C++ (.cpp/.hpp) — exact 11.x the script checks for
  # Capped: black >=25.9 formats to py3.15 grammar, then its own AST safety check
  # cannot reparse the result under this venv's CPython, so `make format` exits 1.
  # duckdb/scripts/format.py invokes black without --target-version, so the
  # version is the only lever.
  "black>=24,<25.9",      # Python (.py)
  "cmake-format",         # CMakeLists.txt
]

[tool.uv]
package = false

[tool.ruff]
# Match the width the Python test helpers are written at; without this, ruff's
# 88-column default rewraps them on every `ruff format` run.
line-length = 110
