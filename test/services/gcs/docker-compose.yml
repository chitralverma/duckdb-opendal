# fake-gcs-server for the gcs:// test tier. The shared fixtures dir is mounted as
# warehouse/external/ (which also creates the bucket); runtime writes go to the
# in-memory store. The image has no shell, so readiness is ready.sh, not a
# compose healthcheck (see CONTRIBUTING.md, "Service tiers").

name: opendal-gcs-test

services:
  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.2
    ports:
      - "19200:4443"
    volumes:
      - ../fixtures:/data/warehouse/external:ro
    command:
      - "-scheme"
      - "http"
      - "-port"
      - "4443"
      - "-backend"
      - "memory"
      - "-public-host"
      - "127.0.0.1:19200"
      - "-external-url"
      - "http://127.0.0.1:19200"

  # Counts requests (see ../proxy.py).
  proxy:
    image: python:3.12-alpine
    ports:
      - "19201:9101"
    volumes:
      - ../proxy.py:/app/proxy.py:ro
    environment:
      PROXY_UPSTREAM_HOST: fake-gcs
      PROXY_UPSTREAM_PORT: "4443"
      PROXY_BIND_HOST: "0.0.0.0"
      PROXY_BIND_PORT: "9101"
    command: ["python3", "/app/proxy.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 9101), 2)"]
      interval: 2s
      timeout: 5s
      retries: 30
