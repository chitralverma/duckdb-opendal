# Static file server for the http:// test tier. Serves the shared fixtures twice:
# once anonymously and once behind Basic auth, so the tier covers both the
# no-secret and the credentialed path.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Readiness probe for the compose healthcheck.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location /public/ {
        autoindex off;
    }

    # Hive-partitioned layout for the explicit-file-list read.
    location /hive/ {
        autoindex off;
    }

    location /protected/ {
        auth_basic "opendal test";
        auth_basic_user_file /etc/nginx/htpasswd;
        autoindex off;
    }
}
