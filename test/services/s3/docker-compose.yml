# MinIO for the s3:// test tier. `make s3-up` starts the healthchecked services
# and then runs the one-shot `init` (see CONTRIBUTING.md, "Service tiers").
#
# MinIO stopped publishing community images: docker.io/minio/* was removed and
# quay.io/minio/{minio,mc} now return 401 to anonymous pulls. This is a
# source build of the last AGPL release, pinned by digest; it ships `mc` too,
# so the same image serves the init and verify steps.

name: opendal-s3-test

x-minio-image: &minio-image
  ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9

services:
  minio:
    image: *minio-image
    ports:
      - "19100:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  init:
    image: *minio-image
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../fixtures:/fixtures:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/warehouse
        mc mb --ignore-existing local/vault
        # Upload external-read fixtures (written by mc, not opendal) if present.
        if [ -d /fixtures ] && [ -n "$$(ls -A /fixtures 2>/dev/null)" ]; then
          mc cp --recursive /fixtures/ local/warehouse/external/
        fi
        echo 'FINISHED SETTING UP MINIO'

  fault-proxy:
    image: python:3.12-alpine
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "19101:9101"
    volumes:
      - ./fault_proxy.py:/app/fault_proxy.py:ro
    environment:
      FAULT_PROXY_UPSTREAM_HOST: minio
      FAULT_PROXY_UPSTREAM_PORT: "9000"
      FAULT_PROXY_BIND_HOST: "0.0.0.0"
      FAULT_PROXY_BIND_PORT: "9101"
    command: ["python3", "/app/fault_proxy.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 9101), 2)"]
      interval: 2s
      timeout: 5s
      retries: 30
